name: Release (macOS app)

# Builds a prepackaged macOS bundle so a non-technical user can download one
# zip, double-click start.command, and run the app — no Node, npm, or Rust.
#
# Trigger by pushing a version tag (e.g. `git tag v0.1.0 && git push --tags`),
# or run manually from the Actions tab to produce a downloadable artifact.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14   # Apple Silicon; we cross-build a universal binary
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history + tags, so we can diff tag→tag for the changelog

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build Tauri app (universal)
        working-directory: ui
        run: npm run tauri build -- --bundles app --target universal-apple-darwin

      - name: Stage release payload
        run: bash packaging/macos/stage.sh

      - name: Zip (ditto preserves the .app bundle)
        working-directory: dist
        run: ditto -c -k --sequesterRsrc --keepParent "X-Plane Virtual ATC" "X-Plane-Virtual-ATC-macOS.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: X-Plane-Virtual-ATC-macOS
          path: dist/X-Plane-Virtual-ATC-macOS.zip

      - name: Build release notes (with changelog)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Previous release tag reachable from this tag's parent (empty on first release).
          prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            range="${prev}..${TAG}"
            heading="Changes since ${prev}"
          else
            range="${TAG}"          # first release: cap so we don't dump all history
            heading="Changes"
          fi
          # One bullet per commit subject, newest first, dropping the version-bump commits.
          changes=$(git log --no-merges --pretty=format:'- %s' $range \
                      | grep -vE '^- Release v[0-9]' \
                      | { [ -n "$prev" ] && cat || head -n 40; } || true)
          [ -n "$changes" ] || changes="- Maintenance and packaging updates."

          {
            echo "## Download & run (macOS)"
            echo
            echo "1. Download \`X-Plane-Virtual-ATC-macOS.zip\` below and unzip it."
            echo "2. **Run \`setup.command\` from Terminal, once.** The download is unsigned, so double-click and right-click → Open are blocked. Open **Terminal** (⌘-Space → \`Terminal\`), then **drag \`setup.command\` into the window and press Return**. It installs Python + Claude and clears the macOS block on the app and \`start.command\`."
            echo "3. From then on, double-click **\`start.command\`** to fly."
            echo
            echo "See \`READ ME FIRST.txt\` inside the zip for details."
            echo
            echo "## ${heading}"
            echo
            echo "$changes"
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog**: https://github.com/${REPO}/compare/${prev}...${TAG}"
            fi
          } > RELEASE_NOTES.md

          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/X-Plane-Virtual-ATC-macOS.zip
          body_path: RELEASE_NOTES.md
